name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test
      - run: coverage report --fail-under=90

  frontend:
    name: Frontend · lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start Django with the demo catalog
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python manage.py migrate
          python manage.py seed_demo
          python manage.py runserver 127.0.0.1:8000 > ../django.log 2>&1 &
      - name: Build and start Next.js
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx next start -H 127.0.0.1 -p 3000 > ../next.log 2>&1 &
      - name: Wait for both servers
        run: |
          for url in http://127.0.0.1:8000/api/listings http://127.0.0.1:3000/api/listings; do
            curl --silent --fail --retry 30 --retry-connrefused --retry-delay 2 "$url" > /dev/null
          done
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload server logs and Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            django.log
            next.log
            frontend/test-results/
          retention-days: 7
