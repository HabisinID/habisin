name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch replaces the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -W error::RuntimeWarning manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -W error::RuntimeWarning manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python -W error::RuntimeWarning -m coverage run manage.py test
      - name: Generate coverage reports
        if: ${{ !cancelled() }}
        run: |
          coverage xml
          coverage report --fail-under=90
      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  postgres:
    name: Backend · PostgreSQL migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: habisin_ci
          POSTGRES_USER: habisin_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habisin_ci -d habisin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRODUCTION: "True"
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-for-disposable-databases
      DB_NAME: habisin_ci
      DB_USER: habisin_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SCHEMA: public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -W error::RuntimeWarning manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -W error::RuntimeWarning manage.py migrate --noinput
      - run: python manage.py migrate --check
      # Includes the migration upgrade/data-preservation regression tests.
      - run: python -W error::RuntimeWarning manage.py test

  frontend:
    name: Frontend · lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts (image and route types) is gitignored, so generate it first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, postgres, frontend]
    env:
      # Created only by serve-backend.py inside its temporary database.
      HABISIN_TEST_ADMIN_PASSWORD: Browser-CI-Only-Admin-927!
      E2E_ADMIN_USERNAME: workspace_admin
      E2E_ADMIN_PASSWORD: Browser-CI-Only-Admin-927!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start Django with the demo catalog
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -u ../frontend/tests/serve-backend.py > ../django.log 2>&1 &
      - name: Build and start Next.js
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx next start -H 127.0.0.1 -p 3000 > ../next.log 2>&1 &
      - name: Wait for both servers
        run: |
          for url in http://127.0.0.1:8000/api/listings http://127.0.0.1:3000/api/listings; do
            curl --silent --fail --retry 30 --retry-connrefused --retry-delay 2 "$url" > /dev/null
          done
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --trace retain-on-failure --retries=2 --fail-on-flaky-tests
      - name: Upload server logs and Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-debug
          path: |
            django.log
            next.log
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
