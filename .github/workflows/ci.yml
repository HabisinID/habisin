name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch replaces the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test
      - run: coverage report --fail-under=90

  frontend:
    name: Frontend · lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts (image and route types) is gitignored, so generate it first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Test-only account in the disposable database, never a deployed secret.
      HABISIN_TEST_ADMIN_PASSWORD: "Temporary-CI-Admin-927!"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start Django with the demo catalog
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python ../frontend/tests/serve-backend.py > ../django.log 2>&1 &
      - name: Build and start Next.js
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx next start -H 127.0.0.1 -p 3000 > ../next.log 2>&1 &
      - name: Wait for both servers
        run: |
          for url in http://127.0.0.1:8000/api/listings http://127.0.0.1:3000/api/listings; do
            curl --silent --fail --retry 30 --retry-connrefused --retry-delay 2 "$url" > /dev/null
          done
      - name: Run Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          # The backend rate-limits sign-ups, logins and geocoding, so a long run of
          # tests can hit a 429 by timing alone; retried tests are still reported as flaky.
          npm run test:e2e -- --trace retain-on-failure --retries=2
      - name: Upload server logs and Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-debug
          path: |
            django.log
            next.log
            frontend/test-results/
          retention-days: 7
